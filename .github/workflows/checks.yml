name: Reusable validation
on:
  workflow_call:
    outputs:
      matrix:
        description: Validated candidate build matrix
        value: ${{ jobs.validation.outputs.matrix }}
      packages_required:
        description: Whether native package qualification replaces build-only checks
        value: ${{ jobs.validation.outputs.packages_required }}
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      packages_required: ${{ steps.policy.outputs.packages_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'ci_policy_tests.py' -v
      - run: python3 -m unittest discover -s tests -p 'packaging_tests.py' -v
      - run: python3 -m unittest discover -s tests -p 'release_tests.py' -v
      - id: policy
        run: python3 tools/ci/checks.py validate
