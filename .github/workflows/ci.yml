name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  title-hint:
    name: Release note hint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/ci/checks.py title-hint
  validation:
    uses: ./.github/workflows/checks.yml
  builds:
    needs: validation
    if: needs.validation.outputs.packages_required == 'false' && needs.validation.outputs.docs_only != 'true'
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.validation.outputs.matrix }}
  package-source:
    needs: validation
    if: needs.validation.outputs.packages_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare candidate sources for package qualification only
        run: |
          python3 tools/release/artifacts.py source --source . --candidate --output .ci-results/source
          archive=(.ci-results/source/insidious-*.tar.xz)
          python3 tools/packaging/prepare.py --source "${archive[0]}" --output .ci-results/prepared
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-source
          overwrite: true
          path: .ci-results/prepared/
          if-no-files-found: error
          retention-days: 14
  packages:
    needs: [validation, package-source]
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read
    with:
      matrix: ${{ needs.validation.outputs.matrix }}
      source-artifact: candidate-source
  required:
    name: CI required
    if: always()
    needs: [validation, builds, package-source, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every expected job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.validation.outputs.docs_only }}
          PACKAGES_REQUIRED: ${{ needs.validation.outputs.packages_required }}
        run: python3 tools/ci/checks.py aggregate
