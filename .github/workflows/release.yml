name: Release publication
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/master' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # Reading drafts requires push access; this job performs no release writes.
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Resolve existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/master
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/ci')
          from checks import build_matrix
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(build_matrix(json.loads(
                  Path('packaging/platforms.json').read_text()))) + '\n')
          PY
  source:
    needs: prepare
    if: needs.prepare.outputs.draft == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create source archive and recipes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release/artifacts.py source --source . \
            --output .ci-results/source --tag "$RELEASE_TAG"
          python3 tools/packaging/prepare.py --source ".ci-results/source/insidious-${RELEASE_TAG#v}.tar.xz" \
            --output .ci-results/prepared --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: .ci-results/prepared/
          if-no-files-found: error
          overwrite: true
  packages:
    needs: [prepare, source]
    uses: ./.github/workflows/packages.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      source-artifact: release-source
  publish:
    needs: [prepare, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: prepared
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
      - name: Stage downloads and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-bundle
          version=${RELEASE_TAG#v}
          cp "prepared/insidious-$version.tar.xz" release-bundle/
          cp prepared/PKGBUILD "release-bundle/insidious-$version-arch-PKGBUILD"
          cp prepared/insidious.spec "release-bundle/insidious-$version-fedora44.spec"
          find packages -type f \( -name '*.pkg.tar.zst' -o -name '*.rpm' \) -exec cp -t release-bundle/ {} +
          cd release-bundle
          sha256sum * > SHA256SUMS
      - name: Replace draft downloads and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Recheck immediately before mutation, including on a retry of this job.
          gh release view "$RELEASE_TAG" --json isDraft,databaseId > release.json
          if [[ $(jq -r .isDraft release.json) != true ]]; then
            echo 'Release already published; nothing to change.'
            exit 0
          fi
          release_id=$(jq -r .databaseId release.json)
          gh api --paginate "repos/$GH_REPO/releases/$release_id/assets" --jq '.[].id' > asset-ids
          while read -r asset_id; do
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
          done < asset-ids
          gh release upload "$RELEASE_TAG" release-bundle/*
          gh release edit "$RELEASE_TAG" --tag "$RELEASE_TAG" --verify-tag --draft=false --title "Insidious ${RELEASE_TAG#v}" --latest
